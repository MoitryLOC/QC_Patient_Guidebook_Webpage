
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Queensway Carleton Hospital - Patient Handbook</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {

            color: #243746;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 25px;
            background: white;
            border-radius: 12px;

        h1 {
            font-size: 26px;

        }
        p {

<body>
    <main class="container">
        <h1>Queensway Carleton Hospital</h1>
        <h2>Patient Handbook</h2>
        <p>Access the latest patient handbook using the link below.</p>
        <a class="button"
