<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queensway Carleton Hospital - Patient Handbook</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
.slideshow-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
.slides { display: flex; width: 100%; height: 100%; transition: transform .25s ease; }
.slides img { width: 100vw; height: 100vh; object-fit: contain; flex: 0 0 100vw; }
.nav-button, .zoom-button { position: absolute; border: 0; border-radius: 4px; padding: 12px 15px; background: rgba(0,0,0,.58); color: #fff; cursor: pointer; z-index: 10; font-size: 18px; }
.prev { top: 50%; left: 12px; transform: translateY(-50%); }
.next { top: 50%; right: 12px; transform: translateY(-50%); }
.zoom-button { top: 12px; right: 12px; font-size: 14px; }
.counter { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: white; background: rgba(0,0,0,.58); padding: 7px 12px; border-radius: 4px; font-size: 14px; }
@media (max-width: 600px) { .nav-button { padding: 10px 12px; } }
</style>
</head>
<body>
<div class="slideshow-container">
<div class="slides" id="slides">
<img src="Slide1.PNG" alt="Patient handbook page 1">
<img src="Slide2.PNG" alt="Patient handbook page 2">
<img src="Slide3.PNG" alt="Patient handbook page 3">
<img src="Slide4.PNG" alt="Patient handbook page 4">
<img src="Slide5.PNG" alt="Patient handbook page 5">
<img src="Slide6.PNG" alt="Patient handbook page 6">
<img src="Slide7.PNG" alt="Patient handbook page 7">
<img src="Slide8.PNG" alt="Patient handbook page 8">
<img src="Slide9.PNG" alt="Patient handbook page 9">
<img src="Slide10.PNG" alt="Patient handbook page 10">
<img src="Slide11.PNG" alt="Patient handbook page 11">
<img src="Slide12.PNG" alt="Patient handbook page 12">
<img src="Slide13.PNG" alt="Patient handbook page 13">
<img src="Slide14.PNG" alt="Patient handbook page 14">
<img src="Slide15.PNG" alt="Patient handbook page 15">
<img src="Slide16.PNG" alt="Patient handbook page 16">
<img src="Slide17.PNG" alt="Patient handbook page 17">
<img src="Slide18.PNG" alt="Patient handbook page 18">
<img src="Slide19.PNG" alt="Patient handbook page 19">
<img src="Slide20.PNG" alt="Patient handbook page 20">
<img src="Slide21.PNG" alt="Patient handbook page 21">
<img src="Slide22.PNG" alt="Patient handbook page 22">
<img src="Slide23.PNG" alt="Patient handbook page 23">
<img src="Slide24.PNG" alt="Patient handbook page 24">
<img src="Slide25.PNG" alt="Patient handbook page 25">
<img src="Slide26.PNG" alt="Patient handbook page 26">
<img src="Slide27.PNG" alt="Patient handbook page 27">
<img src="Slide28.PNG" alt="Patient handbook page 28">
<img src="Slide29.PNG" alt="Patient handbook page 29">
<img src="Slide30.PNG" alt="Patient handbook page 30">
<img src="Slide31.PNG" alt="Patient handbook page 31">
</div>
<button class="nav-button prev" onclick="moveSlide(-1)" aria-label="Previous page">&#10094;</button>
<button class="nav-button next" onclick="moveSlide(1)" aria-label="Next page">&#10095;</button>
<button class="zoom-button" onclick="zoomImage()">Zoom In/Out</button>
<div class="counter" id="counter">Page 1 of 31</div>
</div>
<script>
let currentIndex = 0;
let zoomLevel = 1;
const slideTrack = document.getElementById('slides');
const slides = document.querySelectorAll('.slides img');
function updateSlide() {
  slideTrack.style.transform = `translateX(-${currentIndex * 100}vw)`;
  document.getElementById('counter').textContent = `Page ${currentIndex + 1} of ${slides.length}`;
}
function moveSlide(step) {
  currentIndex = (currentIndex + step + slides.length) % slides.length;
  updateSlide();
}
function zoomImage() {
  zoomLevel = zoomLevel === 1 ? 1.5 : 1;
  slides.forEach((slide, index) => {
    slide.style.transform = index === currentIndex ? `scale(${zoomLevel})` : 'scale(1)';
  });
}
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') moveSlide(1);
  if (event.key === 'ArrowLeft') moveSlide(-1);
});
</script>
</body>
</html>
